spring.application.name=opposite-of-boring

# In-memory database; browse it at http://localhost:8080/h2-console (JDBC URL below, user "sa", no password)
spring.datasource.url=jdbc:h2:mem:chaos
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# SSE streams stay open indefinitely
spring.mvc.async.request-timeout=-1

management.endpoints.web.exposure.include=health,info,metrics

# How often hype drifts back toward zero
chaos.decay-interval=4s
chaos.seed-demo-data=true
