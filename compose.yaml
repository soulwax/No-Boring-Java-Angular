# The whole room on one machine: `docker compose up --build --wait`, then open http://localhost:8080.
# Only nginx is published; the backend is reachable through it, just like on Vercel.
name: opposite-of-boring

services:
  backend:
    build: ./backend
    image: ghcr.io/soulwax/no-boring-backend:${TAG:-local}
    environment:
      CHAOS_SEED_DEMO_DATA: "true"
      # Taken from the shell or the project's .env; empty means in-memory H2 and no sign-in
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ghcr.io/soulwax/no-boring-frontend:${TAG:-local}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
